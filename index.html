<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ff41">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Burner - PWA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div class="header">
            <span class="title">AI EVOLUTION ENGINE</span>
            <span id="gen-label">GEN: <span id="gen">1</span></span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <label>DATA COLLECTÉE</label>
                <div class="value" id="data">0</div>
            </div>
            <div class="stat-box">
                <label>PUISSANCE DE CALCUL</label>
                <div class="value" id="gflops">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="buy-pop">
                <span>+1 BOT</span>
                <small>COÛT: 1 DATA</small>
            </button>
            <button class="btn" id="buy-complex">
                <span>+ INTELLIGENCE</span>
                <small>COÛT: 20 DATA</small>
            </button>
            <div class="slider-group">
                <label>MUTATION: <span id="mut-val">5</span>%</label>
                <input type="range" id="mut-slider" min="1" max="50" value="5">
            </div>
        </div>

        <div class="footer">
            COEURS ACTIFS: <span id="cores">0</span>
        </div>
    </div>

    <canvas id="sim"></canvas>

    <script src="formatter.js"></script>
    <script src="main.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log("Nouvelle version détectée, redémarrage...");
                window.location.reload(); 
              }
            });
          });
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
</body>
</html>
