<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ff41">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Core Burner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="sim"></canvas>

    <!-- TOP BAR -->
    <div id="topbar">
        <div class="tb-stat">
            <span class="tb-label">DATA</span>
            <span class="tb-val" id="data">0</span>
        </div>
        <div class="tb-center">
            <span class="tb-title">AI·EVO</span>
            <span class="tb-gen">GEN <span id="gen">1</span></span>
        </div>
        <div class="tb-stat tb-right">
            <span class="tb-label">NIVEAU</span>
            <span class="tb-val" id="level-display">1</span>
        </div>
    </div>

    <!-- LEVEL BANNER -->
    <div id="level-banner" class="hidden">
        <span id="level-banner-text">NIVEAU 1</span>
    </div>

    <!-- MINI HUD -->
    <div id="mini-hud">
        <div class="hud-item">
            <span class="hud-label">BOTS</span>
            <span class="hud-val" id="reached-count">0/5</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">FLOPS</span>
            <span class="hud-val" id="gflops">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">DIV</span>
            <div class="mini-bar"><div class="mini-bar-fill" id="dna-bar-fill"></div></div>
        </div>
        <div class="hud-item">
            <span class="hud-label">×MUL</span>
            <span class="hud-val" id="prestige-mult">1.0</span>
        </div>
    </div>

    <!-- BOTTOM PANEL -->
    <div id="bottom-panel">

        <button id="panel-toggle">
            <div class="toggle-pip"></div>
            <span id="toggle-arrow">▲</span>
            <span id="toggle-label">MENU</span>
        </button>

        <div id="panel-inner">

            <!-- Tabs -->
            <div id="panel-nav">
                <button class="nav-btn active" data-panel="bots">🤖 BOTS</button>
                <button class="nav-btn" data-panel="evol">🧬 ÉVOL</button>
                <button class="nav-btn" data-panel="skills">⚡ SKILLS</button>
                <button class="nav-btn" data-panel="market">📈 MARCHÉ</button>
                <button class="nav-btn" data-panel="stats">📊 STATS</button>
            </div>

            <div id="panel-content">

                <!-- BOTS -->
                <div class="panel active" id="panel-bots">
                    <div class="row-2">
                        <button class="btn" id="buy-pop">
                            <span>+1 BOT</span><small>COÛT: 1</small>
                        </button>
                        <button class="btn" id="buy-complex">
                            <span>+INTEL</span><small>COÛT: 20</small>
                        </button>
                    </div>
                    <div class="row-2 mt8">
                        <button class="btn btn-prestige-buy" id="btn-prestige">
                            <span>⬆ PRESTIGE</span><small id="prestige-cost">COÛT: 500</small>
                        </button>
                        <button class="btn btn-danger" id="reset-game">
                            <span>🗑 RESET</span><small>TOUT EFFACER</small>
                        </button>
                    </div>
                </div>

                <!-- ÉVOLUTION -->
                <div class="panel" id="panel-evol">
                    <div class="slider-group">
                        <label>MUTATION: <span id="mut-val">5</span>%
                            <span class="param-hint">Chance de modifier un gène</span>
                        </label>
                        <input type="range" id="mut-slider" min="1" max="50" value="5">
                    </div>
                    <div class="slider-group">
                        <label>ÉLITE: <span id="elite-val">20</span>%
                            <span class="param-hint">Part de la pop. qui se reproduit</span>
                        </label>
                        <input type="range" id="elite-slider" min="5" max="50" value="20" step="5">
                    </div>
                    <div class="slider-group">
                        <label>CROSSOVER: <span id="cross-val">50</span>%
                            <span class="param-hint">Chance de mélanger 2 parents</span>
                        </label>
                        <input type="range" id="cross-slider" min="0" max="100" value="50" step="10">
                    </div>
                    <div class="slider-group">
                        <label>ÉLITISME: <span id="elitism-val">0</span> bots
                            <span class="param-hint">Copies exactes des meilleurs (0 = désactivé)</span>
                        </label>
                        <input type="range" id="elitism-slider" min="0" max="10" value="0" step="1">
                    </div>
                    <div class="slider-group">
                        <label>PRESSION: <span id="pressure-val">1.0</span>×
                            <span class="param-hint">Force de sélection des meilleurs</span>
                        </label>
                        <input type="range" id="pressure-slider" min="10" max="40" value="10" step="5">
                    </div>
                    <div class="evol-info" id="evol-info">—</div>
                </div>

                <!-- SKILLS -->
                <div class="panel" id="panel-skills">
                    <div class="skill-grid">
                        <button class="btn btn-skill" id="skill-speed"><span></span><small></small></button>
                        <button class="btn btn-skill" id="skill-memory"><span></span><small></small></button>
                        <button class="btn btn-skill" id="skill-resistance"><span></span><small></small></button>
                        <button class="btn btn-skill" id="skill-sensors"><span></span><small></small></button>
                    </div>
                </div>

                <!-- MARKET -->
                <div class="panel" id="panel-market">
                    <div class="market-info">
                        <span class="market-label">TAUX ACTUEL</span>
                        <span id="market-rate" class="market-rate-val">1.00x</span>
                        <span id="market-feedback" class="market-feedback"></span>
                    </div>
                    <div class="row-2">
                        <button class="btn btn-market" id="btn-sell-gflops">
                            <span>VENDRE</span><small>GFLOPS→DATA</small>
                        </button>
                        <button class="btn btn-market" id="btn-buy-gflops">
                            <span>ACHETER</span><small>DATA→GFLOPS</small>
                        </button>
                    </div>
                    <div class="gflops-stock">
                        GFLOPS STOCKÉS: <span id="gflops-stored">0</span>
                    </div>
                </div>

                <!-- STATS -->
                <div class="panel" id="panel-stats">
                    <div class="stats-row">
                        <span class="stat-lbl">PRESTIGE</span><span id="prestige-count">0</span>
                        <span class="stat-lbl ml">MULT</span><span id="prestige-mult2">1.0x</span>
                    </div>
                    <div class="stats-row">
                        <span class="stat-lbl">WORKERS</span><span id="cores">—</span>
                        <span class="stat-lbl ml">NIVEAU</span><span id="level-display2">1</span>
                    </div>
                    <div class="stats-row">
                        <span class="stat-lbl">FITNESS MOY.</span><span id="avg-fitness">—</span>
                        <span class="stat-lbl ml">MEILLEUR</span><span id="best-fitness">—</span>
                    </div>
                    <div class="section-lbl">FITNESS / GÉNÉRATION</div>
                    <canvas id="fitness-graph" width="340" height="55"></canvas>
                    <div class="section-lbl">DIVERSITÉ ADN — <span id="dna-diversity">0%</span></div>
                    <div class="dna-bar-wrap"><div class="dna-bar-fill2" id="dna-bar-fill2"></div></div>
                </div>

            </div>
        </div>
    </div>

    <script src="formatter.js"></script>
    <script src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    nw.addEventListener('statechange', () => {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller) window.location.reload();
                    });
                });
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return; refreshing = true; window.location.reload();
            });
        }
    </script>
</body>
</html>
